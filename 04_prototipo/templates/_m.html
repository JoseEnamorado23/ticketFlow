{% macro est(s) %}<span class="badge s-{{s}}">{{ ESTADOS[s] }}</span>{% endmacro %}
{% macro pri(p) %}<span class="badge p-{{p}}">{{ PRIORIDADES[p] }}</span>{% endmacro %}
{% macro csrf_input() %}<input type="hidden" name="_csrf" value="{{ csrf }}">{% endmacro %}
{% macro pct(n, d) %}{{ ((n or 0) / d * 100)|round|int if d else 0 }}{% endmacro %}
{% macro ico(n) %}<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{% if n=='panel' %}<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>{% elif n=='tickets' %}<path d="M3 9a2 2 0 0 0 0 6v3a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-3a2 2 0 0 1 0-6V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z"/><path d="M13 5v2M13 11v2M13 17v2"/>{% elif n=='plus' %}<path d="M12 5v14M5 12h14"/>{% elif n=='alert' %}<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.5v.01"/>{% elif n=='log' %}<path d="M8 6h12M8 12h12M8 18h12M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>{% elif n=='users' %}<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.9.7 3.2 2.4 3.5 5.2"/>{% elif n=='down' %}<path d="M12 4v11M7 11l5 5 5-5M4 20h16"/>{% elif n=='check' %}<path d="m5 12 4.5 4.5L19 7"/>{% elif n=='clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>{% elif n=='shield' %}<path d="M12 3 4 6v6c0 4.5 3.2 7.8 8 9 4.8-1.2 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/>{% elif n=='inbox' %}<path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5.5 5h13L21 13v6H3v-6z"/>{% elif n=='repeat' %}<path d="M17 3l3 3-3 3"/><path d="M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3"/><path d="M20 13v2a3 3 0 0 1-3 3H4"/>{% elif n=='star' %}<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>{% elif n=='bolt' %}<path d="M13 3 5 14h6l-1 7 8-11h-6z"/>{% endif %}</svg>{% endmacro %}
